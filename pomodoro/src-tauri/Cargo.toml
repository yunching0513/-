[package]
name = "flowmato"
version = "1.0.0"
description = "Flowmato 心流鐘 — 順應大腦限制的專注工具"
authors = ["吳昀慶 Yun Ching Wu <https://www.linkedin.com/in/yunching0513/>"]
license = "MIT"
repository = "https://github.com/yunching0513/-"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flowmato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# tray-icon / macos-private-api 在行動平台會被忽略，
# 程式碼層以 #[cfg(desktop)] 隔離，不影響 iOS / Android 建置
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
