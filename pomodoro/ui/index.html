<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>蕃茄鐘</title>
<script>if (window.__TAURI__) document.documentElement.classList.add('tauri');</script>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="focus">

<main class="app" id="app">
  <header class="titlebar" data-tauri-drag-region>
    <div class="win-actions">
      <button id="pinBtn" class="icon-btn" title="釘選在最上層" aria-label="釘選在最上層" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="pin-body" d="M9 10.6V7a3 3 0 1 1 6 0v3.6l2.05 2.9a.9.9 0 0 1-.74 1.5H7.69a.9.9 0 0 1-.74-1.5Z"/>
          <path d="M12 15.5V21"/>
        </svg>
      </button>
      <button id="setBtn" class="icon-btn" title="設定（⌘,）" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 7.5h8.4M17.6 7.5H20M4 12h2.4M11.6 12H20M4 16.5h9.9M18.6 16.5H20"/>
          <circle cx="15" cy="7.5" r="2.1"/>
          <circle cx="9" cy="12" r="2.1"/>
          <circle cx="16.2" cy="16.5" r="2.1"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="mode-row">
    <span id="modeLabel" class="mode-label">專注</span>
  </div>

  <div class="ring-wrap" id="ringWrap">
    <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
      <circle class="ring-track" cx="130" cy="130" r="118"/>
      <circle class="ring-bar" id="ringBar" cx="130" cy="130" r="118"/>
    </svg>
    <div class="ring-center">
      <div id="time" class="time">25:00</div>
      <div class="dots" id="dots" title="第 4 輪專注後進入長休息">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="resetBtn" class="ghost-btn" title="重設（R）" aria-label="重設">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.3"/>
        <path d="M3.5 3.5v4.8h4.8"/>
      </svg>
    </button>
    <button id="playBtn" class="play-btn" title="開始／暫停（空白鍵）" aria-label="開始">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <path d="M9.2 6.6v10.8l9-5.4z"/>
      </svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <rect x="8.1" y="6.4" width="2.7" height="11.2" rx="1.2"/>
        <rect x="13.2" y="6.4" width="2.7" height="11.2" rx="1.2"/>
      </svg>
    </button>
    <button id="skipBtn" class="ghost-btn" title="跳過這一段（S）" aria-label="跳過">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.8v10.4a.5.5 0 0 0 .77.42l8.1-5.2a.5.5 0 0 0 0-.84l-8.1-5.2a.5.5 0 0 0-.77.42Z"/>
        <path d="M18 6.5v11"/>
      </svg>
    </button>
  </div>

  <footer class="today" id="today">準備好開始專注了嗎？</footer>

<div class="backdrop" id="backdrop" hidden></div>

<section class="sheet" id="sheet" hidden aria-label="設定">
  <header class="sheet-head">
    <h2>設定</h2>
    <button id="closeSheet" class="icon-btn" title="關閉（Esc）" aria-label="關閉設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
      </svg>
    </button>
  </header>

  <div class="sheet-body">
    <div class="row">
      <span class="row-label">專注時長</span>
      <div class="stepper" data-key="focus" data-min="5" data-max="90" data-step="5">
        <button class="step-btn" data-dir="-1" aria-label="減少">−</button>
        <span class="step-val"><b>25</b> 分</span>
        <button class="step-btn" data-dir="1" aria-label="增加">＋</button>
      </div>
    </div>
    <div class="row">
      <span class="row-label">短休息</span>
      <div class="stepper" data-key="short" data-min="1" data-max="30" data-step="1">
        <button class="step-btn" data-dir="-1" aria-label="減少">−</button>
        <span class="step-val"><b>5</b> 分</span>
        <button class="step-btn" data-dir="1" aria-label="增加">＋</button>
      </div>
    </div>
    <div class="row">
      <span class="row-label">長休息<small>每 4 輪專注後</small></span>
      <div class="stepper" data-key="long" data-min="5" data-max="45" data-step="5">
        <button class="step-btn" data-dir="-1" aria-label="減少">−</button>
        <span class="step-val"><b>15</b> 分</span>
        <button class="step-btn" data-dir="1" aria-label="增加">＋</button>
      </div>
    </div>

    <div class="row-sep"></div>

    <label class="row switch-row">
      <span class="row-label">自動開始休息</span>
      <input type="checkbox" id="optAutoBreak" checked><i class="switch"></i>
    </label>
    <label class="row switch-row">
      <span class="row-label">休息後自動開始專注</span>
      <input type="checkbox" id="optAutoFocus"><i class="switch"></i>
    </label>
    <label class="row switch-row">
      <span class="row-label">提示音</span>
      <input type="checkbox" id="optSound" checked><i class="switch"></i>
    </label>
    <label class="row switch-row">
      <span class="row-label">桌面通知</span>
      <input type="checkbox" id="optNotify" checked><i class="switch"></i>
    </label>
  </div>
</section>
</main>

<p class="web-hints" aria-hidden="true"><kbd>空白鍵</kbd> 開始／暫停　<kbd>R</kbd> 重設　<kbd>S</kbd> 跳過　<kbd>⌘,</kbd> 設定</p>

<script src="app.js"></script>
</body>
</html>
