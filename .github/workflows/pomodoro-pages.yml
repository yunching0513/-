name: Pomodoro web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/pomodoro-focus-tool-er00mo"]
    paths:
      - "pomodoro/ui/**"
      - ".github/workflows/pomodoro-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，不取消進行中的那個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy 蕃茄鐘 web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # repo 尚未開啟 Pages 時自動啟用
          enablement: true

      - name: Upload ui/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pomodoro/ui

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
