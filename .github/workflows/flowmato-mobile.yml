name: Flowmato mobile build

on:
  workflow_dispatch:
  push:
    branches: ["claude/pomodoro-focus-tool-er00mo"]
    paths:
      - "pomodoro/src-tauri/**"
      - "pomodoro/ui/**"
      - ".github/workflows/flowmato-mobile.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pomodoro/src-tauri -> target"

      - name: Install JS deps
        working-directory: pomodoro
        run: npm install

      - name: Init Android project
        working-directory: pomodoro
        run: npx tauri android init

      # 有上傳金鑰就簽章，沒有就產出未簽章版本供檢查。
      # 設定方式見 pomodoro/docs/PUBLISHING.md
      # 沒設定金鑰時會產出 debug 簽章的 AAB：可安裝測試，但不能上傳 Play。
      # 金鑰設定方式見 pomodoro/docs/PUBLISHING.md
      - name: Configure signing
        working-directory: pomodoro
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::未設定 ANDROID_KEYSTORE_BASE64，將產出 debug 簽章版本（無法上傳 Play）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/upload.jks
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=upload.jks
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          PROPS
          echo "::notice::已套用上傳金鑰簽章"

      - name: Build AAB
        working-directory: pomodoro
        run: npx tauri android build --aab

      - name: List output
        if: always()
        run: find pomodoro/src-tauri/gen/android -name "*.aab" -o -name "*.apk" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: flowmato-android
          path: |
            pomodoro/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            pomodoro/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pomodoro/src-tauri -> target"

      - name: Install JS deps
        working-directory: pomodoro
        run: npm install

      - name: Ensure CocoaPods
        run: pod --version || sudo gem install cocoapods

      # 送審前置檔案壞掉的話，最晚要在這裡發現，不要等到上傳被 Apple 退
      - name: Preflight（圖示、截圖、文案、隱私權清單）
        working-directory: pomodoro
        run: node scripts/preflight-ios.mjs

      - name: Validate plists
        working-directory: pomodoro
        run: |
          plutil -lint src-tauri/Info.ios.plist
          plutil -lint src-tauri/ios/PrivacyInfo.xcprivacy

      - name: Init iOS project
        working-directory: pomodoro
        run: npx tauri ios init

      # 完整的 .ipa 需要 Apple 憑證與 provisioning profile，只有帳號持有人能產生。
      # 這裡只驗證 Rust 端與 Xcode 專案能編譯；打包步驟見 PUBLISHING.md。
      - name: Compile Rust for iOS
        working-directory: pomodoro/src-tauri
        run: cargo build --target aarch64-apple-ios --release

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: flowmato-ios-xcodeproj
          path: pomodoro/src-tauri/gen/apple
          if-no-files-found: warn
