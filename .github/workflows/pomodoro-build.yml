name: Pomodoro macOS build

on:
  workflow_dispatch:
  push:
    tags: ["pomodoro-v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build 蕃茄鐘 .dmg (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pomodoro/src-tauri -> target"

      - name: Install JS deps
        working-directory: pomodoro
        run: npm install

      - name: Build Tauri app
        working-directory: pomodoro
        run: npx tauri build

      - name: List bundle output
        if: always()
        run: ls -R pomodoro/src-tauri/target/release/bundle 2>/dev/null || true

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-macos
          path: pomodoro/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/pomodoro-v')
        uses: softprops/action-gh-release@v2
        with:
          files: pomodoro/src-tauri/target/release/bundle/dmg/*.dmg
